<!doctype html>
<html lang="te">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="author" content="Kolli Tatababu">
<title>Linkers Audio Class</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Guntur:wght@400;500;600;700&family=Ramabhadra&display=swap">
<style>
/* Layout: sticky teacher header, one column of lesson cards, fixed bottom player bar with a big ON/OFF switch */
:root {
  --bg: #eef2f8;
  --surface: #ffffff;
  --ink: #1a2232;
  --muted: #56617a;
  --line: #d6dde9;
  --accent: #1f4e9c;
  --accent-ink: #ffffff;
  --accent-soft: #e3ebf8;
  --hl: #ffe7a3;
  --hl-ink: #3b2a00;
  --ok: #1d7a4e;
  --bad: #b3261e;
  --on: #1d8a52;
  --off: #b3261e;
  --display: "Ramabhadra", "Hind Guntur", "Noto Sans Telugu", sans-serif;
  --body: "Hind Guntur", "Noto Sans Telugu", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1522; --surface: #182133; --ink: #e6ebf5; --muted: #9aa6bf; --line: #2b3850;
    --accent: #7fa6ec; --accent-ink: #0f1522; --accent-soft: #1e2b45; --hl: #5a4708; --hl-ink: #fff3cc;
    --ok: #5ccb93; --bad: #ff8a80; --on: #3fbf7f; --off: #e5675c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1522; --surface: #182133; --ink: #e6ebf5; --muted: #9aa6bf; --line: #2b3850;
  --accent: #7fa6ec; --accent-ink: #0f1522; --accent-soft: #1e2b45; --hl: #5a4708; --hl-ink: #fff3cc;
  --ok: #5ccb93; --bad: #ff8a80; --on: #3fbf7f; --off: #e5675c; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.6; margin: 0; }
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 0 190px; }

header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--accent); color: var(--accent-ink);
  margin-inline: -16px; padding: 12px 16px;
  display: flex; align-items: center; gap: 14px;
}
header.top img { width: 64px; height: 64px; border-radius: 50%; border: 3px solid var(--accent-ink); object-fit: cover; flex-shrink: 0; }
header.top .t { min-width: 0; }
header.top h1 { font-family: var(--display); font-weight: 400; font-size: 1.45rem; line-height: 1.2; margin: 0; text-wrap: balance; }
header.top .sub { font-size: .9rem; opacity: .9; }

.intro { margin-block: 18px 6px; color: var(--muted); font-size: .98rem; }
.voicewarn { background: var(--hl); color: var(--hl-ink); border-radius: 10px; padding: 10px 14px; margin-top: 12px; font-size: .95rem; }

.lessons { display: flex; flex-direction: column; gap: 16px; margin-top: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; scroll-margin-top: 110px; transition: box-shadow .2s, border-color .2s; }
.card.active { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.card h2 { margin: 0; padding: 12px 16px; font-size: 1.12rem; font-weight: 700; display: flex; align-items: baseline; gap: 10px; border-bottom: 1px solid var(--line); }
.card h2 .no { font-family: var(--display); font-weight: 400; color: var(--accent); font-size: 1.2rem; font-variant-numeric: tabular-nums; }
.card .content { padding: 12px 16px; }
.card .content p { margin: 0 0 8px; }
.ex { margin: 4px 0; }
.ex b { color: var(--accent); }
.good { color: var(--ok); font-weight: 700; }
.wrong { color: var(--bad); font-weight: 700; text-decoration: line-through; }
.formula { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; padding: 10px; border: 1.5px dashed var(--accent); border-radius: 10px; font-weight: 700; margin: 6px 0 10px; }
.tag { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 2px 12px; }

.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .96rem; }
th, td { text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: .85rem; letter-spacing: .03em; }
td.pv { font-weight: 700; color: var(--accent); }
td { overflow-wrap: anywhere; }

.q { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin-top: 8px; }
.q .opts { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 4px; }
.ans { margin-top: 6px; font-weight: 700; color: var(--ok); }

details.say { border-top: 1px dashed var(--line); }
details.say summary { cursor: pointer; padding: 10px 16px; font-weight: 600; color: var(--muted); font-size: .92rem; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
details.say summary::-webkit-details-marker { display: none; }
details.say summary .from { border: 1px solid var(--accent); color: var(--accent); background: transparent; border-radius: 999px; padding: 4px 12px; font: inherit; font-size: .85rem; cursor: pointer; white-space: nowrap; }
details.say .lines { padding: 0 16px 14px; display: flex; flex-direction: column; gap: 4px; }
.seg { border-radius: 6px; padding: 2px 6px; margin-inline: -6px; transition: background .15s; }
.seg[lang="en"] { font-style: italic; }
.seg.now { background: var(--hl); color: var(--hl-ink); }

footer.credit { text-align: center; margin-top: 26px; padding: 14px; border-top: 2px solid var(--accent); color: var(--accent); font-weight: 700; font-size: 1rem; }

.player {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -6px 18px rgba(0,0,0,.08);
}
.player .inner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
.now-title { font-size: .9rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.now-title b { color: var(--ink); }
.bar { height: 5px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
.ctrls { display: flex; align-items: center; gap: 10px; }
.btn { font: inherit; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; height: 48px; min-width: 48px; padding: 0 12px; font-weight: 600; cursor: pointer; }
.btn:focus-visible, .switch:focus-visible, .from:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.switch {
  flex: 1; height: 54px; border-radius: 999px; border: none; cursor: pointer; font: inherit;
  font-weight: 700; font-size: 1.15rem; display: flex; align-items: center; justify-content: center; gap: 10px;
  background: var(--on); color: #fff;
}
.switch.isOn { background: var(--off); }
.switch .dot { width: 14px; height: 14px; border-radius: 50%; background: #fff; }
.switch.isOn .dot { animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .switch.isOn .dot { animation: none; } .card { transition: none; } }
.speed { display: flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--muted); }
.speed input { flex: 1; accent-color: var(--accent); }
.speed output { font-variant-numeric: tabular-nums; min-width: 3.2em; text-align: right; }
</style>
<style>html{color-scheme:light}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <img id="photo" alt="ఉపాధ్యాయుడు కొల్లి తాతబాబు" src="">
    <div class="t">
      <h1>Linkers – వినే పాఠం</h1>
      <div class="sub">AP TET · English · English & తెలుగు వివరణ</div>
    </div>
  </header>

  <p class="intro">కింద ఉన్న <b>ఆన్</b> బటన్ నొక్కితే పాఠం తనంతట తానే వివరిస్తూ చదువుతుంది. ఆపాలంటే <b>ఆఫ్</b> నొక్కండి. ఏ భాగం నుండైనా వినాలంటే ఆ భాగంలో "ఇక్కడి నుండి వినండి" నొక్కండి.</p>
  <div id="voicewarn" class="voicewarn" hidden></div>

  <div class="lessons" id="lessons"></div>

  <footer class="credit">ఈ యాప్ ఉపాధ్యాయుడు కొల్లి తాతబాబు చే డిజైన్ చేయబడింది</footer>
</div>

<div class="player" role="region" aria-label="Player">
  <div class="inner">
    <div class="now-title" id="nowTitle">సిద్ధంగా ఉంది · <b>1. పరిచయం</b></div>
    <div class="bar"><span id="prog"></span></div>
    <div class="ctrls">
      <button class="btn" id="prev" aria-label="మునుపటి భాగం">⏮</button>
      <button class="switch" id="toggle" aria-pressed="false"><span class="dot"></span><span id="toggleLabel">ఆన్ – వినండి</span></button>
      <button class="btn" id="next" aria-label="తరువాతి భాగం">⏭</button>
      <button class="btn" id="restart" aria-label="మొదటి నుండి">↺</button>
    </div>
    <label class="speed" for="rate">వేగం <input id="rate" type="range" min="0.6" max="1.4" step="0.1" value="0.9"><output id="rateOut">0.9×</output></label>
  </div>
</div>

      <div class="formula"><span class="tag">ఆలోచన 1</span> + <span class="tag">Linker = సంబంధం</span> + <span class="tag">ఆలోచన 2</span></div>`,
    say: [E("Linkers are words or phrases that join words, clauses or sentences and show the relationship between ideas."),
          T("అంటే, పదాలను గానీ, వాక్యాలను గానీ కలిపి, రెండు ఆలోచనల మధ్య ఉన్న సంబంధాన్ని చెప్పే పదాలను linkers అంటారు."),
          T("వీటినే connectors, లేదా conjunctions అని కూడా అంటారు."),
          E("He is poor but honest."), T("ఇక్కడ but వ్యతిరేకతను చూపిస్తుంది."),
          E("I stayed at home because it was raining."), T("ఇక్కడ because కారణాన్ని చూపిస్తుంది."),
          T("ముఖ్యమైన ట్రిక్. ప్రశ్నలో ఖాళీకి ముందు, తర్వాత ఉన్న రెండు భాగాల మధ్య సంబంధం ఏమిటో ముందు ఆలోచించండి. అదే సమాధానం చెబుతుంది.")] },

  { title: "Linkers – రకాలు (ఒక్క చూపులో)", html: `
      <div class="tablewrap"><table>
        <thead><tr><th>పని (Function)</th><th>Linkers</th></tr></thead>
        <tbody>
          <tr><td>కలపడం (Addition)</td><td class="pv">and, also, moreover, besides, furthermore, in addition, as well as</td></tr>
          <tr><td>వ్యతిరేకత (Contrast)</td><td class="pv">but, yet, however, although, though, despite, in spite of, whereas, while, nevertheless</td></tr>
          <tr><td>కారణం (Cause)</td><td class="pv">because, since, as, because of, due to, owing to</td></tr>
          <tr><td>ఫలితం (Result)</td><td class="pv">so, therefore, thus, hence, consequently, as a result</td></tr>
          <tr><td>షరతు (Condition)</td><td class="pv">if, unless, provided that, in case, as long as</td></tr>
          <tr><td>ఉద్దేశం (Purpose)</td><td class="pv">so that, in order to, lest</td></tr>
          <tr><td>సమయం (Time)</td><td class="pv">when, while, before, after, as soon as, until, till</td></tr>
          <tr><td>ఎంపిక (Choice)</td><td class="pv">or, either…or, neither…nor, otherwise</td></tr>
          <tr><td>ఉదాహరణ (Example)</td><td class="pv">for example, for instance, such as</td></tr>
          <tr><td>సారాంశం (Summary)</td><td class="pv">in short, in brief, in conclusion, finally</td></tr>
        </tbody></table></div>`,
    say: [T("ఇప్పుడు linkers రకాలను పని ఆధారంగా ఒక్క చూపులో చూద్దాం."),
          T("కలపడానికి. and, also, moreover, besides, furthermore, in addition."),
          T("వ్యతిరేకతకు. but, yet, however, although, though, despite, in spite of, whereas."),
          T("కారణానికి. because, since, as, because of, due to."),
          T("ఫలితానికి. so, therefore, thus, hence, consequently."),
          T("షరతుకు. if, unless, provided that, in case."),
          T("ఉద్దేశానికి. so that, in order to, lest."),
          T("సమయానికి. when, while, before, after, as soon as, until."),
          T("ఎంపికకు. or, either or, neither nor, otherwise."),
          T("ఉదాహరణకు. for example, such as. సారాంశానికి. in short, in conclusion."),
          T("ఇప్పుడు ముఖ్యమైన వాటిని నియమాలతో ఒక్కొక్కటిగా చూద్దాం.")] },

  { title: "1. కలపడం – Addition", html: `
      <div class="tablewrap"><table>
        <thead><tr><th>Linker</th><th>ఉదాహరణ</th></tr></thead>
        <tbody>
          <tr><td class="pv">and</td><td>Ravi <b>and</b> Sita are friends.</td></tr>
          <tr><td class="pv">also</td><td>He sings. He <b>also</b> dances.</td></tr>
          <tr><td class="pv">moreover / furthermore</td><td>The house is big. <b>Moreover</b>, it is cheap.</td></tr>
          <tr><td class="pv">besides / in addition</td><td><b>Besides</b> English, he knows Hindi.</td></tr>
          <tr><td class="pv">as well as</td><td>She <b>as well as</b> her friends <b>is</b> coming.</td></tr>
          <tr><td class="pv">not only … but also</td><td>He is <b>not only</b> clever <b>but also</b> hardworking.</td></tr>
        </tbody></table></div>
      <p style="margin-top:8px"><b>ట్రిక్:</b> <b>as well as</b> తో verb మొదటి subject ను బట్టి: <span class="good">She as well as her friends is…</span></p>`,
    say: [T("మొదటి రకం. కలపడం, అంటే Addition."),
          T("and రెండు సమానమైన వాటిని కలుపుతుంది."), E("Ravi and Sita are friends."),
          T("also అంటే కూడా."), E("He sings. He also dances."),
          T("moreover, furthermore అంటే అంతేకాక. ఇవి సాధారణంగా వాక్యం మొదట్లో, కామాతో వస్తాయి."),
          E("The house is big. Moreover, it is cheap."),
          T("besides అంటే దానితో పాటు."), E("Besides English, he knows Hindi."),
          T("as well as తో ట్రిక్. Verb మొదటి subject ను బట్టి వస్తుంది."),
          E("She as well as her friends is coming."),
          T("not only, but also. రెండూ కలిసే వస్తాయి."), E("He is not only clever but also hardworking.")] },

  { title: "2. వ్యతిరేకత – But, Yet, However", html: `
      <div class="tablewrap"><table>
        <thead><tr><th>Linker</th><th>స్థానం</th><th>ఉదాహరణ</th></tr></thead>
        <tbody>
          <tr><td class="pv">but</td><td>రెండు భాగాల మధ్య</td><td>He is poor <b>but</b> honest.</td></tr>
          <tr><td class="pv">yet</td><td>మధ్యలో (అయినప్పటికీ)</td><td>He worked hard, <b>yet</b> he failed.</td></tr>
          <tr><td class="pv">however</td><td>కొత్త వాక్యం మొదట్లో, తర్వాత కామా</td><td>It was raining. <b>However</b>, we went out.</td></tr>
          <tr><td class="pv">nevertheless</td><td>కొత్త వాక్యం మొదట్లో</td><td>He was tired. <b>Nevertheless</b>, he continued.</td></tr>
          <tr><td class="pv">whereas / while</td><td>రెండింటి పోలికలో తేడా</td><td>Ravi is tall, <b>whereas</b> his brother is short.</td></tr>
        </tbody></table></div>`,
    say: [T("రెండవ రకం. వ్యతిరేకత, అంటే Contrast. పరీక్షలో అతి ఎక్కువగా వచ్చేది ఇదే."),
          T("but రెండు వ్యతిరేక భాగాలను మధ్యలో కలుపుతుంది."), E("He is poor but honest."),
          T("yet అంటే అయినప్పటికీ."), E("He worked hard, yet he failed."),
          T("however, nevertheless సాధారణంగా కొత్త వాక్యం మొదట్లో వస్తాయి. తర్వాత కామా ఉంటుంది."),
          E("It was raining. However, we went out."),
          T("whereas, while రెండు విషయాల మధ్య తేడాను పోల్చి చెబుతాయి."),
          E("Ravi is tall, whereas his brother is short.")] },

  { title: "2. వ్యతిరేకత – Although vs Despite", html: `
      <div class="formula"><span class="tag">Although / Though / Even though</span> + <span class="tag">Subject + Verb</span></div>
      <div class="formula"><span class="tag">Despite / In spite of</span> + <span class="tag">Noun / V-ing</span></div>
      <p class="ex"><b>Although</b> it was raining, we went out.</p>
      <p class="ex"><b>Despite</b> the rain, we went out.</p>
      <p class="ex"><b>In spite of</b> being ill, he attended the class.</p>
      <p style="margin-top:8px"><b>అతి ముఖ్యమైన ట్రిక్స్:</b></p>
      <p><span class="wrong">Although he is poor, but he is honest.</span><br><span class="good">Although he is poor, he is honest.</span> — although తో but రాదు. (yet రావచ్చు)</p>
      <p><span class="wrong">despite of</span> <span class="good">despite</span> · <span class="good">in spite of</span> — despite తో of రాదు.</p>`,
    say: [T("ఇప్పుడు పరీక్షలో అతి ఎక్కువగా అడిగే జంట. although మరియు despite."),
          T("although, though, even though తర్వాత పూర్తి వాక్యం వస్తుంది. అంటే subject, verb ఉంటాయి."),
          E("Although it was raining, we went out."),
          T("despite, in spite of తర్వాత noun గానీ, ing రూపం గానీ వస్తుంది. పూర్తి వాక్యం రాదు."),
          E("Despite the rain, we went out."), E("In spite of being ill, he attended the class."),
          T("అతి ముఖ్యమైన ట్రిక్. although ఉన్న వాక్యంలో but రాదు."),
          T("Although he is poor, but he is honest. ఇది తప్పు."),
          E("Although he is poor, he is honest."), T("ఇది సరైనది. కావాలంటే yet వాడవచ్చు."),
          T("రెండవ ట్రిక్. despite of అనడం తప్పు. despite అనాలి, లేదా in spite of అనాలి.")] },

  { title: "3. కారణం – Cause / Reason", html: `
      <div class="formula"><span class="tag">because / since / as</span> + <span class="tag">Subject + Verb</span></div>
      <div class="formula"><span class="tag">because of / due to / owing to</span> + <span class="tag">Noun</span></div>
      <p class="ex">He was absent <b>because</b> he was ill.</p>
      <p class="ex">He was absent <b>because of</b> illness.</p>
      <p class="ex"><b>Since</b> it is late, let us go home.</p>
      <p class="ex"><b>As</b> I was tired, I went to bed early.</p>
      <p class="ex">The match was cancelled <b>due to</b> rain.</p>
      <p style="margin-top:8px"><b>ట్రిక్:</b> <span class="wrong">Because he was ill, so he was absent.</span> — because తో so రాదు.</p>`,
    say: [T("మూడవ రకం. కారణం, అంటే Cause."),
          T("because, since, as తర్వాత పూర్తి వాక్యం వస్తుంది."),
          E("He was absent because he was ill."),
          T("because of, due to, owing to తర్వాత noun మాత్రమే వస్తుంది."),
          E("He was absent because of illness."),
          T("because, because of మధ్య తేడా ఇదే. ఒకదాని తర్వాత వాక్యం, మరొక దాని తర్వాత noun."),
          E("Since it is late, let us go home."), E("As I was tired, I went to bed early."),
          E("The match was cancelled due to rain."),
          T("ట్రిక్. because ఉన్న వాక్యంలో so రాదు. Because he was ill, so he was absent అనడం తప్పు.")] },

  { title: "4. ఫలితం – Result", html: `
      <div class="tablewrap"><table>
        <thead><tr><th>Linker</th><th>ఉదాహరణ</th></tr></thead>
        <tbody>
          <tr><td class="pv">so</td><td>It was raining, <b>so</b> we stayed at home.</td></tr>
          <tr><td class="pv">therefore / hence / thus</td><td>He worked hard. <b>Therefore</b>, he passed.</td></tr>
          <tr><td class="pv">consequently / as a result</td><td>He did not study. <b>As a result</b>, he failed.</td></tr>
          <tr><td class="pv">so + adj / adv + that</td><td>He was <b>so</b> tired <b>that</b> he slept at once.</td></tr>
          <tr><td class="pv">such + (a) + adj + noun + that</td><td>It was <b>such a</b> hot day <b>that</b> we stayed in.</td></tr>
        </tbody></table></div>
      <p style="margin-top:8px"><b>ట్రిక్:</b> <b>so</b> తర్వాత adjective మాత్రమే · <b>such</b> తర్వాత noun ఉంటుంది. <b>too … to</b> = ప్రతికూల ఫలితం: He is <b>too</b> weak <b>to</b> walk.</p>`,
    say: [T("నాలుగవ రకం. ఫలితం, అంటే Result."),
          T("so అంటే అందువల్ల."), E("It was raining, so we stayed at home."),
          T("therefore, hence, thus కొంచెం formal. సాధారణంగా కొత్త వాక్యం మొదట్లో వస్తాయి."),
          E("He worked hard. Therefore, he passed."),
          E("He did not study. As a result, he failed."),
          T("so that జంట. so తర్వాత adjective, ఆ తర్వాత that."),
          E("He was so tired that he slept at once."),
          T("such that జంట. such తర్వాత noun ఉంటుంది."),
          E("It was such a hot day that we stayed in."),
          T("ట్రిక్. so తర్వాత adjective మాత్రమే. such తర్వాత noun ఉంటుంది."),
          T("too to అంటే ప్రతికూల ఫలితం. ఎంత బలహీనంగా ఉన్నాడంటే నడవలేడు."), E("He is too weak to walk.")] },

  { title: "5. షరతు – Condition", html: `
      <div class="tablewrap"><table>
        <thead><tr><th>Linker</th><th>అర్థం</th><th>ఉదాహరణ</th></tr></thead>
        <tbody>
          <tr><td class="pv">if</td><td>ఒకవేళ</td><td><b>If</b> you work hard, you will pass.</td></tr>
          <tr><td class="pv">unless</td><td>= if … not (లేకపోతే)</td><td><b>Unless</b> you work hard, you will fail.</td></tr>
          <tr><td class="pv">provided that / as long as</td><td>ఆ షరతు మీద మాత్రమే</td><td>You can go <b>provided that</b> you return early.</td></tr>
          <tr><td class="pv">in case</td><td>ఒకవేళ జరిగితే (ముందు జాగ్రత్త)</td><td>Take an umbrella <b>in case</b> it rains.</td></tr>
          <tr><td class="pv">otherwise / or else</td><td>లేకపోతే</td><td>Hurry up, <b>otherwise</b> you will miss the bus.</td></tr>
        </tbody></table></div>
      <p style="margin-top:8px"><b>ట్రిక్:</b> <b>unless</b> లోనే <b>not</b> ఉంది. <span class="wrong">Unless you do not work hard</span> <span class="good">Unless you work hard</span> · unless / if clause లో <b>will</b> రాదు.</p>`,
    say: [T("ఐదవ రకం. షరతు, అంటే Condition."),
          T("if అంటే ఒకవేళ."), E("If you work hard, you will pass."),
          T("unless అంటే if not. లేకపోతే అని అర్థం."), E("Unless you work hard, you will fail."),
          T("అతి ముఖ్యమైన ట్రిక్. unless లోనే not ఉంది. కాబట్టి unless తో మళ్ళీ not వాడకూడదు."),
          T("Unless you do not work hard అనడం తప్పు. Unless you work hard అనాలి."),
          T("అలాగే if, unless ఉన్న భాగంలో will రాదు. Simple present వస్తుంది."),
          T("provided that అంటే ఆ షరతు మీద మాత్రమే."), E("You can go provided that you return early."),
          T("in case అంటే ముందు జాగ్రత్తగా."), E("Take an umbrella in case it rains."),
          T("otherwise అంటే లేకపోతే."), E("Hurry up, otherwise you will miss the bus.")] },

  { title: "6. ఉద్దేశం – Purpose", html: `
      <div class="tablewrap"><table>
        <thead><tr><th>Linker</th><th>నిర్మాణం</th><th>ఉదాహరణ</th></tr></thead>
        <tbody>
          <tr><td class="pv">so that</td><td>+ subject + can / could / may / might</td><td>He works hard <b>so that</b> he <b>can</b> pass.</td></tr>
          <tr><td class="pv">in order to</td><td>+ V1</td><td>He saves money <b>in order to</b> buy a car.</td></tr>
          <tr><td class="pv">to</td><td>+ V1</td><td>She went to the market <b>to</b> buy vegetables.</td></tr>
          <tr><td class="pv">lest</td><td>+ subject + should (= so that … not)</td><td>Walk carefully <b>lest</b> you <b>should</b> fall.</td></tr>
        </tbody></table></div>
      <p style="margin-top:8px"><b>ట్రిక్:</b> <b>lest</b> లో not దాగి ఉంది → <b>lest … should</b>, not రాదు.</p>`,
    say: [T("ఆరవ రకం. ఉద్దేశం, అంటే Purpose."),
          T("so that తర్వాత subject, ఆ తర్వాత can, could, may, might వస్తాయి."),
          E("He works hard so that he can pass."),
          T("in order to, to తర్వాత V one వస్తుంది."),
          E("He saves money in order to buy a car."),
          T("lest అంటే so that not. ఏదైనా జరగకుండా ఉండటానికి."),
          E("Walk carefully lest you should fall."),
          T("ట్రిక్. lest లోనే not దాగి ఉంది. lest తర్వాత ఎప్పుడూ should. not రాదు.")] },

  { title: "7. సమయం – Time", html: `
      <div class="tablewrap"><table>
        <thead><tr><th>Linker</th><th>ఉదాహరణ</th></tr></thead>
        <tbody>
          <tr><td class="pv">when</td><td><b>When</b> I reached the station, the train had left.</td></tr>
          <tr><td class="pv">while</td><td><b>While</b> I was reading, the light went off.</td></tr>
          <tr><td class="pv">before / after</td><td>Wash your hands <b>before</b> you eat.</td></tr>
          <tr><td class="pv">as soon as</td><td><b>As soon as</b> he saw the police, he ran away.</td></tr>
          <tr><td class="pv">until / till</td><td>Wait here <b>until</b> I come.</td></tr>
          <tr><td class="pv">no sooner … than</td><td><b>No sooner</b> had he reached <b>than</b> it started raining.</td></tr>

// Build narration for word-list sections
sections.forEach(s => {
  if (!s.list) return;
  s.html = `<div class="tablewrap"><table><thead><tr><th>Phrasal Verb</th><th>Meaning</th><th>తెలుగు</th></tr></thead><tbody>` +
    s.list.map(([p,m,t]) => `<tr><td class="pv">${p}</td><td>${m}</td><td>${t}</td></tr>`).join('') + `</tbody></table></div>`;
  s.say = [T('ఇప్పుడు ముఖ్యమైన phrasal verbs, వాటి అర్థాలు నేర్చుకుందాం.')];
  s.list.forEach(([p,m,t]) => { s.say.push(E(`${p}. ${m}.`)); s.say.push(T(`తెలుగులో, ${t}.`)); });
});

// Render
const root = document.getElementById('lessons');
sections.forEach((s, si) => {
  const card = document.createElement('section');
  card.className = 'card'; card.id = 'sec' + (si + 1);
  card.innerHTML = `<h2><span class="no">${si + 1}</span><span>${s.title}</span></h2>
    <div class="content">${s.html}</div>
    <details class="say"${si === 0 ? ' open' : ''}><summary><span>గురువు వివరణ (వినిపించే పాఠం)</span><button class="from" data-s="${si}" type="button">ఇక్కడి నుండి వినండి</button></summary>
    <div class="lines">${s.say.map(([l, t], i) => `<span class="seg" lang="${l}" data-i="${i}">${t}</span>`).join('')}</div></details>`;
  root.appendChild(card);
});

// Voices
let voices = [];
function loadVoices() { try { voices = speechSynthesis.getVoices(); } catch (e) { voices = []; } checkVoices(); }
function pick(lang) {
  const want = lang === 'te' ? ['te-IN', 'te'] : ['en-IN', 'en-GB', 'en-US', 'en'];
  for (const w of want) { const v = voices.find(v => v.lang && v.lang.replace('_','-').toLowerCase().startsWith(w.toLowerCase())); if (v) return v; }
  return null;
}
function checkVoices() {
  const warn = document.getElementById('voicewarn');
  if (!('speechSynthesis' in window)) { warn.textContent = 'ఈ బ్రౌజర్‌లో చదివే సౌకర్యం లేదు. Chrome బ్రౌజర్‌లో తెరవండి.'; warn.hidden = false; return; }
  if (voices.length && !pick('te')) {
    warn.textContent = 'మీ పరికరంలో తెలుగు వాయిస్ కనిపించలేదు. ఫోన్ Settings → Text-to-speech → Google Speech Services లో తెలుగు వాయిస్ డౌన్‌లోడ్ చేయండి.';
    warn.hidden = false;
  } else warn.hidden = true;
}
if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; } else checkVoices();

// Player
const totalSegs = sections.reduce((a, s) => a + s.say.length, 0);
let cur = { s: 0, i: 0 }, started = false, playing = false, gen = 0, rate = 0.9, wake = null;
const toggle = document.getElementById('toggle'), label = document.getElementById('toggleLabel');

function segEl(s, i) { return document.querySelector(`#sec${s + 1} .seg[data-i="${i}"]`); }
function mark() {
  document.querySelectorAll('.seg.now').forEach(e => e.classList.remove('now'));
  document.querySelectorAll('.card.active').forEach(e => e.classList.remove('active'));
  const card = document.getElementById('sec' + (cur.s + 1));
  card.classList.add('active');
  const el = segEl(cur.s, cur.i);
  if (playing && el) { el.classList.add('now'); card.querySelector('details').open = true; }
  const done = sections.slice(0, cur.s).reduce((a, s) => a + s.say.length, 0) + cur.i;
  document.getElementById('prog').style.width = (100 * done / totalSegs) + '%';
  document.getElementById('nowTitle').innerHTML = `${playing ? 'వింటున్నారు' : (started ? 'ఆగిపోయింది' : 'సిద్ధంగా ఉంది')} · <b>${cur.s + 1}. ${sections[cur.s].title}</b>`;
}
function scrollToCur() {
  const el = segEl(cur.s, cur.i) || document.getElementById('sec' + (cur.s + 1));
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  el.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'center' });
}
function speak() {
  if (!playing) return;
  if (cur.i >= sections[cur.s].say.length) {
    if (cur.s + 1 >= sections.length) { cur = { s: sections.length - 1, i: sections[sections.length - 1].say.length - 1 }; setPlaying(false); document.getElementById('prog').style.width = '100%'; document.getElementById('nowTitle').innerHTML = 'పాఠం పూర్తయింది · <b>మళ్ళీ వినడానికి ↺ నొక్కండి</b>'; return; }
    cur.s++; cur.i = 0;
  }
  const [lang, text] = sections[cur.s].say[cur.i];
  mark(); scrollToCur();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang === 'te' ? 'te-IN' : 'en-IN';
  const v = pick(lang); if (v) u.voice = v;
  u.rate = rate;
  const my = ++gen;
  const advance = () => { if (my !== gen || !playing) return; cur.i++; setTimeout(speak, 220); };
  u.onend = advance;
  u.onerror = (e) => { if (e.error === 'interrupted' || e.error === 'canceled') return; advance(); };
  speechSynthesis.speak(u);
}
async function setPlaying(on) {
  playing = on; if (on) started = true;
  toggle.classList.toggle('isOn', on);
  toggle.setAttribute('aria-pressed', on);
  label.textContent = on ? 'ఆఫ్ – ఆపండి' : 'ఆన్ – వినండి';
  if (on) {
    try { wake = await navigator.wakeLock?.request('screen'); } catch (e) { wake = null; }
  } else {
    gen++; try { speechSynthesis.cancel(); } catch (e) {}
    try { wake && wake.release(); } catch (e) {} wake = null;
  }
  mark();
}
function startAt(s, i = 0) {
  gen++; try { speechSynthesis.cancel(); } catch (e) {}
  cur = { s, i };
  if (!playing) setPlaying(true).then(() => setTimeout(speak, 120)); else setTimeout(speak, 120);
}
toggle.addEventListener('click', () => {
  if (!('speechSynthesis' in window)) return;
  if (playing) setPlaying(false); else { setPlaying(true); try { speechSynthesis.cancel(); } catch (e) {} setTimeout(speak, 120); }
});
document.getElementById('next').addEventListener('click', () => { const s = Math.min(cur.s + 1, sections.length - 1); if (playing) startAt(s); else { cur = { s, i: 0 }; mark(); scrollToCur(); } });
document.getElementById('prev').addEventListener('click', () => { const s = cur.i > 1 ? cur.s : Math.max(cur.s - 1, 0); if (playing) startAt(s); else { cur = { s, i: 0 }; mark(); scrollToCur(); } });
document.getElementById('restart').addEventListener('click', () => { if (playing) startAt(0); else { cur = { s: 0, i: 0 }; mark(); scrollToCur(); } });
document.querySelectorAll('.from').forEach(b => b.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); startAt(+b.dataset.s); }));
document.querySelectorAll('.seg').forEach(el => el.addEventListener('click', () => {
  const s = +el.closest('.card').id.slice(3) - 1; startAt(s, +el.dataset.i);
}));
const rateIn = document.getElementById('rate'), rateOut = document.getElementById('rateOut');
rateIn.addEventListener('input', () => { rate = +rateIn.value; rateOut.textContent = rate.toFixed(1) + '×'; });
document.addEventListener('visibilitychange', async () => { if (playing && document.visibilityState === 'visible' && !wake) { try { wake = await navigator.wakeLock?.request('screen'); } catch (e) {} } });
mark();
</script>
